name: OLX Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright openpyxl

      # Install Playwright browser
      - name: Install Chromium
        run: |
          playwright install chromium

      # Show repository files (debug)
      - name: Show files
        run: ls -R

      # Run scraper
      - name: Run scraper
        run: python scraper.py

      # Upload CSV
      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: olx-csv
          path: olx_scraped_v2.csv

      # Upload Excel
      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: olx-excel
          path: olx_scraped_v2.xlsx
